[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-coder"
version = "0.1.0"
description = "A local-first coding agent for terminal-based software work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

[project.scripts]
local-coder = "local_coder.cli.main:cli"
lc = "local_coder.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/local_coder"]
