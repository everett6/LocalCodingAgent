[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-coder"
version = "0.1.0"
description = "A local-first coding agent for terminal-based software work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "watchfiles>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

[project.scripts]
local-coder = "local_coder.cli.main:cli"
lc = "local_coder.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/local_coder"]
exclude = ["**/node_modules/**", "src/local_coder/webui/src/**", "**/__pycache__/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/local_coder/webui/dist" = "local_coder/webui/dist"

[tool.hatch.build.targets.sdist]
exclude = ["ide/upstream", "ide/.build", "ide/extension/bin", "desktop/node_modules", "desktop/release", "src/local_coder/webui/node_modules", ".build-venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
