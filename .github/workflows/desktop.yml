name: Verify and package desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/local_coder/webui/package-lock.json
      - run: npm ci
        working-directory: src/local_coder/webui
      - run: npm run build
        working-directory: src/local_coder/webui
      - run: npm run lint
        working-directory: src/local_coder/webui
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Clin acceptance and release regressions on each native platform
        run: python -m pytest -q tests/test_release_50.py tests/test_harness_evaluation.py tests/test_improvement_loop.py
      - name: Native IDE protocol regressions
        run: npm test --prefix ide
      - name: Portable backend regression tests
        run: python -m pytest -q tests/test_cloud_providers.py tests/test_reasoning_harness.py tests/test_recovery_context.py tests/test_investigations.py tests/test_workbench_api.py tests/test_remote_routes.py tests/test_remote_security.py tests/test_framework.py tests/test_http_workbench.py tests/test_process_cancellation.py tests/test_request_context.py tests/test_harness_recovery.py tests/test_workbench_integration.py tests/test_redteam.py tests/test_file_lock.py tests/test_context_policy.py tests/test_inference_discovery.py tests/test_inference_installer_regressions.py tests/test_provider_api.py tests/test_provider_catalog.py tests/test_provider_profiles.py tests/test_provider_quota.py tests/test_quota_integration.py tests/test_redteam_defaults.py tests/test_workbench_automation.py
      - name: Complete non-trading suite on Linux
        if: runner.os == 'Linux'
        run: python -m pytest -q --ignore=tests/test_trading.py
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -m PyInstaller --noconfirm desktop/engine.spec
      - name: Package native installer without publishing
        run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: local-coder-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
          if-no-files-found: error
