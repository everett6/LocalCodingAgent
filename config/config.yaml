# Local Coding Agent Configuration
# =================================

# Model configurations
models:
  # Primary orchestrator model - used for planning and coordination
  orchestrator:
    name: orchestrator
    backend: openai_compatible
    model_id: "Qwen3-30B-A3B-Instruct-2507"
    base_url: "http://localhost:8090/v1"
    # Matches the llama-server this repo's AI2 stack actually launches with
    # (`-c 65536`). A literal 500000 was requested but does not fit this
    # card: see the "Local model server" section of README.md.
    context_length: 65536
    temperature: 0.3
    max_tokens: 4096
    estimated_vram_mb: 9000

  # Coding agent model
  coder:
    name: coder
    backend: openai_compatible
    model_id: "Qwen3-30B-A3B-Instruct-2507"
    base_url: "http://localhost:8090/v1"
    context_length: 65536
    temperature: 0.2
    max_tokens: 4096
    estimated_vram_mb: 5000

  # Review/debug/test agent model (can share with coder)
  reviewer:
    name: reviewer
    backend: openai_compatible
    model_id: "Qwen3-30B-A3B-Instruct-2507"
    base_url: "http://localhost:8090/v1"
    context_length: 65536
    temperature: 0.1
    max_tokens: 4096
    estimated_vram_mb: 5000

  # Small, genuinely separate draft model for predictive drafting, served
  # on its own port (see README.md's "Local model server" section). This
  # used to point at the SAME 30B model/server as everything else, which
  # defeated the point: a draft call competed for the one GPU slot the main
  # agent call also needed instead of running cheaply alongside it.
  # Qwen2.5-Coder-0.5B fully offloads in under 1GB and runs at ~500 tok/s.
  drafter:
    name: drafter
    backend: openai_compatible
    model_id: "Qwen2.5-Coder-0.5B-Instruct"
    base_url: "http://localhost:8091/v1"
    context_length: 8192
    temperature: 0.4
    max_tokens: 2048
    estimated_vram_mb: 700

# Resource management
resources:
  max_concurrent_gpu_agents: 1
  max_concurrent_cpu_agents: 4
  gpu_memory_target_percent: 85.0
  model_unload_timeout_seconds: 300

# Agent tool permissions (defaults are built-in, override here)
# permissions:
#   - role: coder
#     allowed_tools:
#       - read_file
#       - write_file
#       - ...

# Operations requiring human approval. When true and no interactive
# approval handler is available (e.g. a headless/remote run), the action
# is denied rather than silently allowed.
approval:
  require_approval_for_commands: true
  require_approval_for_commits: true

# Verification loop settings
verification:
  max_fix_iterations: 3
  run_tests_after_changes: true
  require_review: true

# Agentic routing and bounded context. context_window_chars/compact_context_chars
# are sized off the server's real 65536-token window (see models.*.context_length
# and README.md's "Local model server" section): ~61k tokens are left for
# conversation history after reserving max_tokens for the reply, and at a
# conservative ~3.3 chars/token for code that is roughly 200k characters.
# 180000/90000 leaves headroom below that ceiling instead of the previous
# 24000/12000, which was sized for an 8192-token server and compacted after
# using well under a tenth of the real context.
agentic:
  role_models:
    planner: orchestrator
    coder: coder
    reviewer: reviewer
    tester: reviewer
    debugger: coder
  context_window_chars: 180000
  compact_context_chars: 90000
  max_parallel_agents: 1
  # The AI2 llama-server this config points at is launched with
  # --slot-save-path (see README.md's "Local model server" section), so the
  # exploration prefix's KV cache survives a server restart instead of
  # needing a full re-prefill.
  session_cache: true

# Logging
log_level: INFO
log_dir: .local-coder/logs
state_dir: .local-coder/state
